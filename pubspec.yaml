name: second_hand_market
description: "Маркетплейс б/у вещей"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  intl: ^0.19.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/categories/